services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nipo_itams
      MYSQL_USER: itams
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-change-me}
    ports:
      - "3306:3306"
    volumes:
      - nipo_itams_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  nipo_itams_mysql:
